[project]
name = "terrabean-data-pipelines"
version = "0.1.0"
description = "Ingestion: DEM/climate -> reproject/clip -> COG -> MinIO + PostGIS provenance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2",
    "rasterio>=1.3,<2",
    "rioxarray>=0.15",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "rio-cogeo>=5.0",
    "boto3>=1.35",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
