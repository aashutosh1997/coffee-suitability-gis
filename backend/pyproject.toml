[project]
name = "terrabean-backend"
version = "0.1.0"
description = "TerraBean API, Celery workers, and shared geoprocessing library"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    "celery>=5.4,<5.5",
    "redis>=5.1,<6",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
# Geospatial stack for the real scoring engine + terrain spike. From Phase 1 the API and
# worker depend on this at runtime (they read COGs and derive terrain). numpy pinned <2
# until the geo stack confirms numpy-2 compatibility (see docs/phase-0/risk-register.md).
geo = [
    "numpy<2",
    "rasterio>=1.3,<2",
    "rioxarray>=0.15",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "rasterstats>=0.19",
    "rio-cogeo>=5.0",
    "pvlib>=0.11",
    # richdem / WhiteboxTools / exactextract are evaluated by the terrain spike as
    # production options but kept OUT of this extra: they need C/C++ compilation and
    # are flaky to install via wheels. The spike uses them if importable, else NumPy.
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML",
]

# Treat as a virtual project (an application, not a distributable package): uv installs
# only dependencies; app/, worker/, geo/ are imported from the working directory.
[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
