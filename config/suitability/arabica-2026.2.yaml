# =============================================================================
# TerraBean — Arabica suitability model configuration
# =============================================================================
# Version-controlled scoring config (NFR-14): thresholds/weights live HERE, never
# hard-coded. Every change bumps `model_config_version` so results stay reproducible
# (NFR-16) and an assessment can always be traced to the exact config that produced it.
#
# Structured after the FAO Land Suitability Classification (S1/S2/S3/N), combining a
# weighted overlay with hard limiting-factor constraints (Liebig's law of the minimum).
# Defaults transcribed from docs/03-suitability-model.md.
#
# REGION CALIBRATION: the ALTITUDE bands are recalibrated for the Nepal mid-hills
# (~27-28 deg N, subtropical) — the optimal band sits LOWER than the equatorial
# tropical default of 1,200-2,000 m. Temperature/precipitation/slope/shading are kept
# at species-level defaults pending validation against co-op ground truth.
# Rationale: docs/phase-0/agronomy-workshop-notes.md.
#
# -----------------------------------------------------------------------------
# CHANGE 2026.1 -> 2026.2 (Phase 3 tuning demonstration — docs/phase-3):
# The first validation run surfaced a MODEL-SHAPE issue, independent of the data:
# the S3 "marginally suitable" class was effectively unreachable — sites either
# cleared the weighted overlay (>=0.60 -> S1/S2) or tripped a hard limit (-> N),
# so the rating jumped straight from "moderately suitable" to "not suitable" with
# no marginal middle. A site with genuine but manageable limitations should read as
# S3, not S2. So the S3 band is WIDENED UPWARD (S2 floor 0.60 -> 0.70, S3 floor
# 0.40 -> 0.50) — a more conservative class mapping.
# This change is justified on model-shape grounds; it is NOT fitted to the synthetic
# validation labels (which carry no agronomic meaning). Real recalibration awaits the
# co-op's labelled plots + agronomist sign-off (docs/phase-0/ground-truth-plan.md).
# Only `class_thresholds` changed vs 2026.1; factors/weights/bands are identical.
# =============================================================================

model_config_version: "2026.2"
region: "Nepal mid-hills (Gulmi, Syangja, Kavre) — ~27-28 deg N"
based_on: "docs/03-suitability-model.md"
status: "expert starting defaults — calibrate with co-op agronomists before launch"

# Overall weighted score S -> suitability class. Bands below S3 are Not Suitable (N).
# 2026.2: S3 widened upward so moderate limitations land in S3 (marginal) not S2.
class_thresholds:
  S1: 0.80  # Highly Suitable     (S >= 0.80)
  S2: 0.70  # Moderately Suitable (0.70-0.79)
  S3: 0.50  # Marginally Suitable (0.50-0.69); below 0.50 -> N

# Applied to the precipitation sub-score when monthly normals are available.
# A distinct 2-4 month dry/cool period triggers even flowering (bonus); an essentially
# aseasonal regime gives no flowering trigger (penalty). For the Nepal monsoon the
# dry winter (Nov-Feb) is the trigger.
rainfall_distribution_modifier:
  dry_period_months_min: 2
  dry_period_months_max: 4
  bonus: 0.05
  aseasonal_penalty: -0.05

factors:
  # ---- Altitude (m a.s.l.) — RECALIBRATED for ~28 deg N -----------------------
  - name: altitude
    kind: numeric
    unit: m
    weight: 0.25
    bands:
      - { label: optimal,    min: 1000, max: 1500, sub_score: 1.0 }
      - { label: good,       min: 800,  max: 1000, sub_score: 0.8 }
      - { label: good,       min: 1500, max: 1700, sub_score: 0.8 }
      - { label: marginal,   min: 600,  max: 800,  sub_score: 0.4 }
      - { label: marginal,   min: 1700, max: 1900, sub_score: 0.4 }
      - { label: unsuitable, min: null, max: 600,  sub_score: 0.0, hard_limit: true }
      - { label: unsuitable, min: 1900, max: null, sub_score: 0.0, hard_limit: true }

  # ---- Mean annual temperature (deg C) — species default ----------------------
  - name: temperature
    kind: numeric
    unit: degC
    weight: 0.25
    bands:
      - { label: optimal,    min: 18,   max: 22,   sub_score: 1.0 }
      - { label: good,       min: 16,   max: 18,   sub_score: 0.8 }
      - { label: good,       min: 22,   max: 23,   sub_score: 0.8 }
      - { label: marginal,   min: 14,   max: 16,   sub_score: 0.4 }
      - { label: marginal,   min: 23,   max: 25,   sub_score: 0.4 }
      - { label: unsuitable, min: null, max: 14,   sub_score: 0.0, hard_limit: true }
      - { label: unsuitable, min: 25,   max: null, sub_score: 0.0, hard_limit: true }

  # ---- Annual precipitation (mm) — species default ----------------------------
  # Note: out-of-range precipitation scores 0.1 (poor) but is NOT a hard limit;
  # irrigation/drainage management can compensate (doc 03).
  - name: precipitation
    kind: numeric
    unit: mm
    weight: 0.20
    bands:
      - { label: optimal,    min: 1400, max: 2000, sub_score: 1.0 }
      - { label: good,       min: 1200, max: 1400, sub_score: 0.8 }
      - { label: good,       min: 2000, max: 2500, sub_score: 0.8 }
      - { label: marginal,   min: 1000, max: 1200, sub_score: 0.4 }
      - { label: marginal,   min: 2500, max: 3000, sub_score: 0.4 }
      - { label: unsuitable, min: null, max: 1000, sub_score: 0.1 }
      - { label: unsuitable, min: 3000, max: null, sub_score: 0.1 }

  # ---- Slope (%) — species default --------------------------------------------
  - name: slope
    kind: numeric
    unit: percent
    weight: 0.15
    bands:
      - { label: optimal,    min: 5,    max: 25,   sub_score: 1.0 }
      - { label: good,       min: 2,    max: 5,    sub_score: 0.7 }
      - { label: good,       min: 25,   max: 45,   sub_score: 0.7 }
      - { label: marginal,   min: 0,    max: 2,    sub_score: 0.3 }
      - { label: marginal,   min: 45,   max: 60,   sub_score: 0.3 }
      - { label: unsuitable, min: 60,   max: null, sub_score: 0.0 }

  # ---- Shading / solar exposure — categorical ---------------------------------
  # Computed by the engine from terrain shading (DEM: sky-view + insolation +
  # frost-pocket detection) combined with canopy shading (land-cover, when available).
  - name: shading
    kind: categorical
    unit: null
    weight: 0.15
    bands:
      - { label: moderate_shade_warm_site,    condition: "Moderate shade available/feasible in a warm site",        sub_score: 1.0 }
      - { label: adequate_exposure_cool_site, condition: "Adequate exposure in a cool optimal-altitude site",       sub_score: 0.9 }
      - { label: heavy_shade_light_limited,   condition: "Heavy shade where light is already limiting",             sub_score: 0.5 }
      - { label: extreme_exposure_hot_site,   condition: "Extreme exposure in a hot site, no shade feasible",       sub_score: 0.3 }
      - { label: frost_pocket,                condition: "Frost-pocket / strong cold-air pooling detected",         sub_score: 0.2, hard_limit: true }
